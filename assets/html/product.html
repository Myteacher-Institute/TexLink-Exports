<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Products — TexLink Exports</title>
</head>

<body>
    <div id="gallery" class="gallery"></div>
    <div id="product-page"  class="product-container hidden">
        <button id="back-btn">Back to Gallery</button>
        
        <div class="image-gallery">
            <div class="main-image">
                <img src="images/main-placeholder.jpg" alt="Product Image" id="main-img" />
            </div>
            <div class="thumbnails" id="thumbnails"></div>
        </div>

        <div class="product-details">
            <h1 class="product-title" id="product-title"></h1>
            <p class="product-price" id="product-price"></p>
            <p class="product-description" id="product-description"></p>

            <div class="options">
                <label for="size">Size:</label>
                <select id="size">
                    <option value="">Select size</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>

            <div class="quantity">
                <label for="qty">Quantity:</label>
                <input type="number" id="qty" value="1" min="1" />
            </div>

            <button id="add-to-cart">Add to Cart</button>
        </div>
    </div>

    <script src="../js/product.js"></script>
</body>

</html>
