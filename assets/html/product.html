<DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TexLink Exports - Product Gallery</title>
        <link rel="stylesheet" href="../css/product.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
            integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-item-count"></span>
        </div>
        <section class="cart">
            <h1>YOUR CART</h1>
            <div class="cart-content">
                <div class="cart-box">
                    <img src="../image/product 1.jpg" alt="" class="cart-image">
                    <div class="cart-detail">
                        <h2 class="cart-product-title">Blue Hoodie</h2>
                        <span class="cart-price">$100</span>
                        <div class="cart-quantity">
                            <button id="decrease">-</button>
                            <span class="number">1</span>
                            <button id="increase">+</button>
                        </div>
                    </div>
                    <i class="fa-solid fa-trash cart-remove"></i>
                </div>
                
            </div>
            <div class="total">
                <div class="total-title">Total</div>
                <div class="total-price">$0</div>
            </div>
            <button class="btn-buy">Buy Now</button>
            <i class="fa-solid fa-square-xmark" id="cart-close"></i>
        </section>

        <div id="gallery" class="gallery">
            <div class="gallery-item product-box" data-id="1">
                <img src="../images/ankara1.jpg" alt="Ankara Wax1" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart">Add to Cart <i class="fa-solid fa-cart"></i></button>    
            </div>

            <div class="gallery-item product-box" data-id="2">
                <img src="../images/lace1.jpg" alt="lace1" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="3">
                <img src="../images/batik1.jpg" alt="batik1" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="4">
                <img src="../images/ankara2.jpg" alt="ankara2" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="5">
                <img src="../images/lace2.jpg" alt="lace2" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="6">
                <img src="../images/asaoke.jpg" alt="asaoke">
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="7">
                <img src="../images/ankara_fabrics.jpg" alt="ankara_fabs">
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="8">
                <img src="../images/lace3.jpg" alt="lace3">
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="9">
                <img src="../images/women navy plaid gown.jpg" alt="Plaid Gown" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="10">
                <img src="../images/pearl Blush fabric.jpg" alt="Blush fabric" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="11">
                <img src="../images/Nice men senator.jpg" alt="Men Senator" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="11">
                <img src="../images/Nice men senator.jpg" alt="Men Senator" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="11">
                <img src="../images/Nice men senator.jpg" alt="Men Senator" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="11">
                <img src="../images/Nice men senator.jpg" alt="Men Senator" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="11">
                <img src="../images/Nice men senator.jpg" alt="Men Senator" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>

            <div class="gallery-item product-box" data-id="11">
                <img src="../images/Nice men senator.jpg" alt="Men Senator" />
                <h3 class="product-title"></h3>
                <p class="product-price"></p>
                <button id="add-to-cart" class="add-cart">Add to Cart</button>
            </div>
        </div>

        <script src="../js/product.js"></script>
    </body>




    </html>
